# Menu platform — Coolify compose resource (repo root).
# Services: api (Hono: /api/* + static out/ on :3001) + minio (S3).
# DB stays external (Coolify-managed postgres, already running, on `coolify` net).
# NOTE: nothing runs during `docker compose build` and BuildKit cannot join the
# `coolify` network, so the Docker build must NOT need the DB — migrate +
# static export run at container start (entrypoint.sh), where the external DB
# IS reachable.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: '${DATABASE_URL}'
        DIRECT_URL: '${DIRECT_URL}'
        NEXT_PUBLIC_APP_URL: '${NEXT_PUBLIC_APP_URL}'
    environment:
      - 'DATABASE_URL=${DATABASE_URL}'
      - 'DIRECT_URL=${DIRECT_URL}'
      - 'BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}'
      - 'BETTER_AUTH_URL=${BETTER_AUTH_URL}'
      - 'SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}'
      - 'SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-}'
      - 'NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}'
      - 'TENANT_DEFAULT_SLUG=${TENANT_DEFAULT_SLUG}'
      - 'TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}'
      - 'STORAGE_ENDPOINT=http://minio:9000'
      - STORAGE_REGION=us-east-1
      - 'STORAGE_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}'
      - 'STORAGE_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}'
      - STORAGE_BUCKET=menu-media
      - 'STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL}'
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.menu-http.rule=Host(`menu.georgesalebe.me`)
      - traefik.http.routers.menu-http.entrypoints=http
      - traefik.http.routers.menu-http.middlewares=redirect-to-https
      - traefik.http.routers.menu-https.rule=Host(`menu.georgesalebe.me`)
      - traefik.http.routers.menu-https.entrypoints=https
      - traefik.http.routers.menu-https.middlewares=gzip
      - traefik.http.routers.menu-https.tls.certresolver=letsencrypt
      - traefik.http.routers.menu-https.service=menu-svc
      - 'traefik.http.routers.menu-wild.rule=HostRegexp(`^[a-zA-Z0-9-]+\.menu\.georgesalebe\.me$`)'
      - traefik.http.routers.menu-wild.ruleSyntax=v3
      - traefik.http.routers.menu-wild.entrypoints=http
      - traefik.http.routers.menu-wild.middlewares=redirect-to-https
      - traefik.http.routers.menu-wild.priority=1
      - 'traefik.http.routers.menu-wild-https.rule=HostRegexp(`^[a-zA-Z0-9-]+\.menu\.georgesalebe\.me$`)'
      - traefik.http.routers.menu-wild-https.ruleSyntax=v3
      - traefik.http.routers.menu-wild-https.entrypoints=https
      - traefik.http.routers.menu-wild-https.middlewares=gzip
      - traefik.http.routers.menu-wild-https.tls.certresolver=letsencrypt
      - 'traefik.http.routers.menu-wild-https.tls.domains[0].main=*.menu.georgesalebe.me'
      - traefik.http.routers.menu-wild-https.service=menu-svc
      - traefik.http.routers.menu-wild-https.priority=1
      - traefik.http.services.menu-svc.loadbalancer.server.port=3001
    networks:
      - default
      - coolify

  minio:
    image: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
    command: 'server /data --console-address ":9001"'
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
    volumes:
      - 'minio-data:/data'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.s3menu-http.rule=Host(`s3-menu.georgesalebe.me`)
      - traefik.http.routers.s3menu-http.entrypoints=http
      - traefik.http.routers.s3menu-http.middlewares=redirect-to-https
      - traefik.http.routers.s3menu-https.rule=Host(`s3-menu.georgesalebe.me`)
      - traefik.http.routers.s3menu-https.entrypoints=https
      - traefik.http.routers.s3menu-https.tls.certresolver=letsencrypt
      - traefik.http.routers.s3menu-https.service=s3menu-svc
      - traefik.http.services.s3menu-svc.loadbalancer.server.port=9000
      - traefik.http.routers.miniomenu-http.rule=Host(`minio-menu.georgesalebe.me`)
      - traefik.http.routers.miniomenu-http.entrypoints=http
      - traefik.http.routers.miniomenu-http.middlewares=redirect-to-https
      - traefik.http.routers.miniomenu.rule=Host(`minio-menu.georgesalebe.me`)
      - traefik.http.routers.miniomenu.entrypoints=https
      - traefik.http.routers.miniomenu.tls.certresolver=letsencrypt
      - traefik.http.routers.miniomenu.service=miniomenu-svc
      - traefik.http.services.miniomenu-svc.loadbalancer.server.port=9001
    networks:
      - default
      - coolify

volumes:
  minio-data: {}
networks:
  coolify:
    external: true
